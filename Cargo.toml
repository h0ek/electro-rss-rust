[package]
name = "electro-rss-rust"
version = "0.2.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9" }
glib = "0.21"

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "blocking"] }
roxmltree = "0.20"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha1 = "0.10"
webbrowser = "1"
anyhow = "1"